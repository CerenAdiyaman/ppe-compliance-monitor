[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hardhat-guard"
version = "0.1.0"
description = "PPE compliance monitoring for construction and industrial video streams"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hardhat-guard = "hardhat_guard.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hardhat_guard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
# 3.12, not the 3.10 floor in requires-python: numpy's bundled stubs use
# `type` statement syntax that mypy rejects under an older target.
python_version = "3.12"
packages = ["hardhat_guard"]
ignore_missing_imports = true
